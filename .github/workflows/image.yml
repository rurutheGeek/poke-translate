name: Image

# Publishes ghcr.io/ruruthegeek/poke-translate:<version> from a release's site
# archive, checked against the release's SHA256SUMS. Runs after a release, or by
# hand for an existing tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example v1.0.0)
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      # The Dockerfile comes from the default branch, so older tags can be built too.
      - uses: actions/checkout@v7
      - name: Download the release archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          gh release download "$TAG" --pattern "poke-translate-site-v$version.tar.gz" --pattern SHA256SUMS
          grep "poke-translate-site-v$version.tar.gz" SHA256SUMS | sha256sum --check
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Build and push
        run: |
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/poke-translate"
          echo "${{ github.token }}" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --build-arg "VERSION=$VERSION" -t "$image:$VERSION" .
          docker push "$image:$VERSION"
